name: Build Windows

# Builds the Windows installer on a real Windows runner, where node-pty's
# native addon can be compiled with MSVC (impossible to cross-compile from
# macOS). Trigger it by hand from the Actions tab, or on a version tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-pty here is the prebuilt fork: prebuild-install downloads a ready
      # binary for our Electron target, so no compiler/Python is needed. The env
      # vars tell it to fetch the Electron build (not the Node one).
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_runtime: electron
          npm_config_target: 29.4.6
          npm_config_disturl: https://electronjs.org/headers

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: claude-swarm-lite-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
